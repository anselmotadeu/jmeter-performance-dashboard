name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run test:ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:***@localhost:5432/database
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_mock_ci_key
          STRIPE_PUBLISHABLE_KEY: pk_test_mock_ci_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_ci_secret
          STRIPE_PRICE_GRAFICO_ID: price_mock_grafico_ci
          STRIPE_PRICE_PANORAMA_ID: price_mock_panorama_ci

  cypress:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start Next.js dev server
        run: npm run dev &
        env:
          DATABASE_URL: postgresql://user:***@localhost:5432/database
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_mock_ci_key
          STRIPE_PUBLISHABLE_KEY: pk_test_mock_ci_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_ci_secret
          STRIPE_PRICE_GRAFICO_ID: price_mock_grafico_ci
          STRIPE_PRICE_PANORAMA_ID: price_mock_panorama_ci
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Run Cypress E2E (headless)
        run: npx cypress run --headless --browser electron --spec 'cypress/e2e/**/*.cy.ts'
        env:
          CYPRESS_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
